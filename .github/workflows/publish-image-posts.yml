name: Publish Image Posts

on:
  push:
    branches:
      - main
    paths:
      - "stills/bygone/**"
      - "scripts/publish_image_posts.py"
      - "tests/test_image_posts.py"
      - ".github/workflows/publish-image-posts.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Verify image publishing targets
        run: python -m unittest discover -s tests -p 'test_image_posts.py' -v

      - name: Retire the verified Fieldlog WordPress copy
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python scripts/retire_fieldlog_wordpress.py

      - name: Publish image posts
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
          TITLE_TIMEZONE: ${{ secrets.TITLE_TIMEZONE }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/publish_image_posts.py
