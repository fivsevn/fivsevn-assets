name: Publish YouTube Posts

on:
  push:
    branches:
      - main
    paths:
      - "scripts/publish_youtube_posts.py"
      - "scripts/youtube_source.py"
      - "tests/test_youtube_*.py"
      - ".github/workflows/publish-youtube-posts.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-youtube-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Test YouTube sources and publishing safeguards
        run: python -m unittest discover -s tests -p 'test_youtube_*.py' -v

      - name: Publish YouTube posts
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          YOUTUBE_FIVSEVN_CHANNEL_ID: ${{ secrets.YOUTUBE_FIVSEVN_CHANNEL_ID }}
        run: python scripts/publish_youtube_posts.py
